customHeaders:
  - pattern: '**'
    headers:
      - key: Cache-Control
        value: no-store
      - key: Referrer-Policy
        value: no-referrer
      - key: X-Content-Type-Options
        value: nosniff
      - key: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - key: X-Frame-Options
        value: DENY
