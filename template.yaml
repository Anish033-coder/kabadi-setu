AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KabadiSetu - household sorting guidance and pickup requests (Jaipur prototype)

Parameters:
  LinkSecretParameterName:
    Type: String
    Default: /kabadi-setu/link-secret
    Description: SSM SecureString holding the pickup-link HMAC secret. Create it before the first deploy (make secret).
  RecognitionEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: 'http://localhost:5173'
    Description: Browser origins allowed to call the API. Set this to the exact HTTPS frontend origin before a public deployment.

Conditions:
  CanRecognize: !Equals [!Ref RecognitionEnabled, 'true']

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: kabadi-setu-households
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        project: kabadi-setu

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: kabadi-setu-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      # Cleanup only. Expiry decisions are made in code because TTL deletion can lag by days.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: project
          Value: kabadi-setu

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /kabadi-setu/api
      RetentionInDays: 14
      Tags:
        - Key: project
          Value: kabadi-setu

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders: [authorization, content-type, idempotency-key]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 600
      Tags:
        project: kabadi-setu

  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: RemoveOldPhotos
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods: [POST]
            AllowedHeaders: [content-type]
            MaxAge: 300
      Tags: [{Key: project, Value: kabadi-setu}]

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProjectDataAndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ApiLogGroup.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LinkSecretParameterName}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${PhotoBucket.Arn}/photos/*
              - !If
                - CanRecognize
                - Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource:
                    - !Sub arn:${AWS::Partition}:bedrock:ap-south-1:${AWS::AccountId}:inference-profile/apac.amazon.nova-lite-v1:0
                    - !Sub arn:${AWS::Partition}:bedrock:ap-south-1::foundation-model/amazon.nova-lite-v1:0
                    - !Sub arn:${AWS::Partition}:bedrock:ap-southeast-1::foundation-model/amazon.nova-lite-v1:0
                    - !Sub arn:${AWS::Partition}:bedrock:ap-southeast-2::foundation-model/amazon.nova-lite-v1:0
                    - !Sub arn:${AWS::Partition}:bedrock:ap-northeast-1::foundation-model/amazon.nova-lite-v1:0
                    - !Sub arn:${AWS::Partition}:bedrock:ap-northeast-2::foundation-model/amazon.nova-lite-v1:0
                    - !Sub arn:${AWS::Partition}:bedrock:ap-northeast-3::foundation-model/amazon.nova-lite-v1:0
                - !Ref AWS::NoValue
      Tags: [{Key: project, Value: kabadi-setu}]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # make package assembles backend/, data/ and policies/ here so the Lambda keeps the repo layout.
      CodeUri: .build/lambda
      Handler: backend.app.handler
      Runtime: python3.14
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 28
      # This account has a total concurrency quota of 10. AWS cannot reserve 2
      # while retaining its required unreserved pool; retain the small account quota.
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          RECOGNITION_ENABLED: !Ref RecognitionEnabled
          PHOTO_BUCKET: !Ref PhotoBucket
          HOUSEHOLD_SCAN_LIMIT: '5'
          GLOBAL_SCAN_LIMIT: '50'
          TABLE_NAME: !Ref Table
          LINK_SECRET_PARAM: !Ref LinkSecretParameterName
          POWERTOOLS_SERVICE_NAME: kabadi-setu
          POWERTOOLS_LOG_LEVEL: INFO
      Role: !GetAtt ApiFunctionRole.Arn
      Tags:
        project: kabadi-setu
      Events:
        CreateScan:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/scans, Method: POST}
        AnalyzeScan:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/api/scans/{scan_id}/analyze', Method: POST}
        Health:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/health, Method: GET, Auth: {Authorizer: NONE}}
        Catalogue:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/catalogue, Method: GET, Auth: {Authorizer: NONE}}
        PickupView:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/pickup/view, Method: POST, Auth: {Authorizer: NONE}}
        PickupAction:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/pickup/action, Method: POST, Auth: {Authorizer: NONE}}
        Decide:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/decide, Method: POST}
        GetBasket:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/basket, Method: GET}
        SaveBasket:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/basket, Method: POST}
        CreateRequest:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/requests, Method: POST}
        RequestDetails:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/api/requests/{request_id}', Method: GET}
        HouseholdAction:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/api/requests/{request_id}/actions', Method: POST}

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Region:
    Value: !Ref AWS::Region
